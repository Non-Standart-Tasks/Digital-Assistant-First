second_step_prompt: |
    
system_prompt_tickets_for_aviasales_economy_helper: |
    
    Тебе дан запрос из чата, который необходимо представить в формате валидного JSON со строгой структурой по следующему примеру:

    Запрос: Какие авиакомпании летают по маршруту Каир - Москва 04.05.25 после обеда?
    И какая цена эконом с багажом
    2 взрослых
    3 младенца
    Обратно через 7-8 дней
    И порекомендуй мне интересные места для посещения в этом маршруте

    {{
        "origin": "Каир",
        "destination": "Москва",
        "adults": 2,
        "children": 0,
        "infants": 3,
        "date_query": "Туда - 4 мая после обеда, обратно 11-12 мая (через 7-8 дней). С багажом.",
        "travel_class": "economy"
    }}

    Создай JSON с подобной структорой для следующего запроса, используй только те ключи, которые указаны в примере! 
