# Основные настройки сервиса
internet_search: True  # Флаг для включения/отключения поиска через SERP API
aviasales_search: False  # Флаг для включения/отключения поиска через API Aviasales 
model: 'gpt-4o-mini'  # Модель LLM для основных запросов
2gis-key: '0a931e51-467b-4e43-a112-42e217cff910'  # API ключ для сервиса 2ГИС
telegram_enabled: False  # Флаг для включения/отключения интеграции с Telegram
collect_messages: 100  # Количество сообщений, сохраняемых в истории для контекста
link_checker: False  # Флаг для включения/отключения проверки ссылок
use_openai_web_search: False  # Использование веб-поиска от OpenAI
web_search_context_size: "low"  # Размер контекста для веб-поиска (low/medium/high)  

# Настройки генератора предложений
offersgen:
  model: deepseek-chat  # Модель LLM для генерации предложений
  offers_db: content/json/offers/raw/offers.json  # Путь к базе данных с предложениями
  rag_n_examples: 40  # Количество примеров для RAG (Retrieval-Augmented Generation)
  city_filter: False  # Флаг для фильтрации предложений по городам
  db_service:
    json_path: content/json/offers/offers_by_category.json  # Путь к JSON с предложениями по категориям
    chunk_overlap: 300  # Размер перекрытия чанков при обработке текста
    chunk_size: 700  # Размер чанка для обработки текста
    dump_path: content/json/offers/offers_docs.json  # Путь для сохранения промежуточных документов
    persist_directory: content/json/offers/offers_persist_db  # Директория для постоянного хранения векторной БД
    collection_name: vtb_family_offers  # Название коллекции в векторной БД

