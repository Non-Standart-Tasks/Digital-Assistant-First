name: Run Tests

on:
  push:
  pull_request:
    branches: [master, develop]
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Проверка кода
        uses: actions/checkout@v3
        
      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Установка uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          
      - name: Установка зависимостей
        run: |
          uv sync
          
      - name: Создание .env файла
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_KEY }}" > .env
          echo "Файл .env создан"

      - name: Добавление ключа TravelPayouts в .env
        run: |
          echo "TRAVELPAYOUTS_API_KEY=${{ secrets.TRAVELPAYOUTS_API_KEY }}" >> .env
          echo "Ключ TravelPayouts добавлен в .env"
          
      - name: Запуск тестов базы данных
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          uv run pytest tests/database_test.py -v
          
      - name: Запуск тестов Streamlit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          uv run pytest tests/streamlit_test.py -v

      - name: Установка Docker
        run: |
          uv run pytest tests/docker_test.py -v

      - name: Публикация результатов тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache
            pytest-report.xml
          retention-days: 7 